<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="provider-glyph-cursor-title provider-glyph-cursor-desc" data-provider="cursor" data-provider-glyph="true" style="color: #E3B91E; --provider-accent: #E3B91E;">
  <title id="provider-glyph-cursor-title">Cursor provider glyph</title>
  <desc id="provider-glyph-cursor-desc">Original monoline pointer with insertion caret mnemonic for Cursor. Not an official logo.</desc>
  <style>

  [data-provider-glyph],
  [data-provider-glyph-catalog] {
    --provider-glyph-contrast: var(--provider-glyph-contrast-color, #000000);
  }

  @media (prefers-color-scheme: dark) {
    [data-provider-glyph],
    [data-provider-glyph-catalog] {
      --provider-glyph-contrast: var(--provider-glyph-contrast-color, #FFFFFF);
    }
  }

  .line {
    fill: none;
    stroke: var(--provider-accent);
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .accent {
    fill: none;
    stroke: var(--provider-accent);
    stroke-width: 1.85;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fine {
    stroke-width: 1.3;
    opacity: 0.76;
  }

  .soft {
    fill: var(--provider-accent);
    opacity: 0.12;
    stroke: none;
  }

  .dot {
    fill: var(--provider-accent);
    stroke: none;
  }

  .contrast-outline {
    pointer-events: none;
  }

  .contrast-outline .line {
    stroke: var(--provider-glyph-contrast);
    stroke-width: 2.75;
    opacity: 1;
  }

  .contrast-outline .accent {
    stroke: var(--provider-glyph-contrast);
    stroke-width: 2.85;
    opacity: 1;
  }

  .contrast-outline .fine {
    stroke-width: 2.3;
    opacity: 1;
  }

  .contrast-outline .soft {
    fill: none;
    stroke: var(--provider-glyph-contrast);
    stroke-width: 1;
    opacity: 1;
  }

  .contrast-outline .dot {
    fill: var(--provider-glyph-contrast);
    stroke: var(--provider-glyph-contrast);
    stroke-width: 1;
    opacity: 1;
  }

  </style>
  <g class="contrast-outline" data-provider-glyph-contrast="true" aria-hidden="true">
    <path class="line" d="M5.7 3.8 18.8 12l-6.1 1.3-2.7 5.8Z" />
    <path class="accent" d="m12.7 13.3 4.2 4.1" />
    <path class="line fine" d="M19.1 5.8v5.1" />
    <path class="line fine" d="M16.6 5.8h5" />
    <circle class="dot" cx="7.7" cy="6.2" r="1.1" />
  </g>
  <g class="foreground">
    <path class="line" d="M5.7 3.8 18.8 12l-6.1 1.3-2.7 5.8Z" />
    <path class="accent" d="m12.7 13.3 4.2 4.1" />
    <path class="line fine" d="M19.1 5.8v5.1" />
    <path class="line fine" d="M16.6 5.8h5" />
    <circle class="dot" cx="7.7" cy="6.2" r="1.1" />
  </g>
</svg>
