<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="provider-glyph-ensemble-title provider-glyph-ensemble-desc" data-provider="ensemble" data-provider-glyph="true" style="color: #986781; --provider-accent: #986781;">
  <title id="provider-glyph-ensemble-title">Ensemble provider glyph</title>
  <desc id="provider-glyph-ensemble-desc">Original multicolour Confluence Loom mnemonic for Ensemble. Not an official logo.</desc>
  <style>

  .ensemble-line,
  .ensemble-accent {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .ensemble-line {
    stroke: url(#provider-glyph-ensemble-spectrum);
    stroke-width: 1.7;
  }

  .ensemble-accent {
    stroke: url(#provider-glyph-ensemble-hub-blue-pool);
    stroke-width: 1.85;
  }

  .ensemble-tail-outline,
  .ensemble-center-outline {
    fill: none;
    stroke: #000000;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .ensemble-tail-outline {
    stroke-width: 3.1;
  }

  .ensemble-center-outline {
    stroke-width: 2.85;
  }

  .ensemble-sparkle-outline {
    fill: #000000;
  }

  .ensemble-sparkle {
    fill: #F8FAFF;
  }

  </style>
  <defs>
