<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="provider-glyph-codex-title provider-glyph-codex-desc" data-provider="codex" data-provider-glyph="true" style="color: #A070F2; --provider-accent: #A070F2;">
  <title id="provider-glyph-codex-title">Codex provider glyph</title>
  <desc id="provider-glyph-codex-desc">Original filled asymmetric command cloud with a terminal cutout for Codex. Not an official logo.</desc>
  <style>

  .line {
    fill: none;
    stroke: var(--provider-accent);
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .accent {
    fill: none;
    stroke: var(--provider-accent);
    stroke-width: 1.85;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fine {
    stroke-width: 1.3;
    opacity: 0.76;
  }

  .soft {
    fill: var(--provider-accent);
    opacity: 0.12;
    stroke: none;
  }

  .dot {
    fill: var(--provider-accent);
    stroke: none;
  }

  .contrast-outline {
    pointer-events: none;
  }

  .contrast-outline .line {
    stroke: #000000;
    stroke-width: 2.75;
    opacity: 1;
  }

  .contrast-outline .accent {
    stroke: #000000;
    stroke-width: 2.85;
    opacity: 1;
  }

  .contrast-outline .fine {
    stroke-width: 2.3;
    opacity: 1;
  }

  .contrast-outline .soft {
    fill: none;
    stroke: #000000;
    stroke-width: 1;
    opacity: 1;
  }

  .contrast-outline .dot {
    fill: #000000;
    stroke: #000000;
    stroke-width: 1;
    opacity: 1;
  }

  </style>
  <g class="contrast-outline" data-provider-glyph-contrast="true" aria-hidden="true">
