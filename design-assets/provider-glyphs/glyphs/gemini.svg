<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="provider-glyph-gemini-title provider-glyph-gemini-desc" data-provider="gemini" data-provider-glyph="true" style="color: #2563EB; --provider-accent: #2563EB;">
  <title id="provider-glyph-gemini-title">Gemini provider glyph</title>
  <desc id="provider-glyph-gemini-desc">Original monoline offset constellation sparkle mnemonic for Gemini. Not an official logo.</desc>
  <style>

  [data-provider-glyph],
  [data-provider-glyph-catalog] {
    --provider-glyph-contrast: var(--provider-glyph-contrast-color, #000000);
  }

  @media (prefers-color-scheme: dark) {
    [data-provider-glyph],
    [data-provider-glyph-catalog] {
      --provider-glyph-contrast: var(--provider-glyph-contrast-color, #FFFFFF);
    }
  }

  .line {
    fill: none;
    stroke: var(--provider-accent);
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .accent {
    fill: none;
    stroke: var(--provider-accent);
    stroke-width: 1.85;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fine {
    stroke-width: 1.3;
    opacity: 0.76;
  }

  .soft {
    fill: var(--provider-accent);
    opacity: 0.12;
    stroke: none;
  }

  .dot {
    fill: var(--provider-accent);
    stroke: none;
  }

  .contrast-outline {
    pointer-events: none;
  }

  .contrast-outline .line {
    stroke: var(--provider-glyph-contrast);
    stroke-width: 2.75;
    opacity: 1;
  }

  .contrast-outline .accent {
    stroke: var(--provider-glyph-contrast);
    stroke-width: 2.85;
    opacity: 1;
  }

  .contrast-outline .fine {
    stroke-width: 2.3;
    opacity: 1;
  }

  .contrast-outline .soft {
    fill: none;
    stroke: var(--provider-glyph-contrast);
    stroke-width: 1;
    opacity: 1;
  }

  .contrast-outline .dot {
    fill: var(--provider-glyph-contrast);
    stroke: var(--provider-glyph-contrast);
    stroke-width: 1;
    opacity: 1;
  }

  </style>
  <g class="contrast-outline" data-provider-glyph-contrast="true" aria-hidden="true">
    <path class="accent" d="M12 3.6l1.7 4.6 4.7 1.7-4.7 1.7L12 16.4l-1.7-4.8-4.7-1.7 4.7-1.7Z" />
    <path class="line" d="M4.4 18.2l1.1 2.6 2.6 1-2.6 1-1.1 2.6-1-2.6-2.7-1 2.7-1Z" transform="translate(1 -3)" />
    <path class="line fine" d="M17.8 4.7h2.8" />
    <path class="line fine" d="M19.2 3.3v2.8" />
  </g>
  <g class="foreground">
    <path class="accent" d="M12 3.6l1.7 4.6 4.7 1.7-4.7 1.7L12 16.4l-1.7-4.8-4.7-1.7 4.7-1.7Z" />
    <path class="line" d="M4.4 18.2l1.1 2.6 2.6 1-2.6 1-1.1 2.6-1-2.6-2.7-1 2.7-1Z" transform="translate(1 -3)" />
    <path class="line fine" d="M17.8 4.7h2.8" />
    <path class="line fine" d="M19.2 3.3v2.8" />
  </g>
</svg>
