<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1575" viewBox="0 0 1400 1575" data-provider-logo-catalog="true">
  <title>TaskWraith provider logo reference catalogue</title>
  <desc>Unmodified official or first-party provider PNGs reviewed on light, dark, and transparency-checker surfaces.</desc>
  <defs>
    <pattern id="alpha-checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#F4F5F7" />
      <path d="M0 0h12v12H0zM12 12h12v12H12z" fill="#D9DDE3" />
    </pattern>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>
  <style>
    .canvas { fill: #0B0D10; }
    .eyebrow {
      fill: #8D97A8;
      font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.16em;
    }
    .title {
      fill: #F8FAFC;
      font: 750 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -0.03em;
    }
    .subtitle {
      fill: #AAB3C2;
      font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .rule { stroke: #29313C; stroke-width: 1; }
    .card {
      fill: #15191F;
      stroke: #282F39;
      stroke-width: 1;
    }
    .provider {
      fill: #F8FAFC;
      font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .provider-detail {
      fill: #8993A3;
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .status {
      fill: #9DA7B7;
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-anchor: end;
      letter-spacing: 0.1em;
    }
    .status-historical { fill: #D5A95E; }
    .surface-light { fill: #FFFFFF; }
    .surface-dark { fill: #080A0D; }
    .surface-frame {
      fill: none;
      stroke: #303844;
      stroke-width: 1;
    }
    .surface-label {
      fill: #7F8999;
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-anchor: middle;
      letter-spacing: 0.08em;
    }
    .missing {
      fill: #707A89;
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-anchor: middle;
      letter-spacing: 0.06em;
    }
    .note-title {
      fill: #F8FAFC;
      font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .note {
      fill: #AAB3C2;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .note-key {
      fill: #728097;
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.1em;
    }
    .footer {
      fill: #788394;
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .footer-end { text-anchor: end; }
  </style>

