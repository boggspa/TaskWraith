<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 240 120" role="img" aria-labelledby="workflow-glyphs-catalog-title workflow-glyphs-catalog-desc">
  <title id="workflow-glyphs-catalog-title">TaskWraith workflow glyph catalog</title>
  <desc id="workflow-glyphs-catalog-desc">Dark and light previews of the original TaskWraith workflow monoline glyph.</desc>
  <defs>
    <g id="workflow-monoline-glyph">
      <path d="M5.1 4.9h5.2c.85 0 1.4.55 1.4 1.4v2c0 .85-.55 1.4-1.4 1.4H5.1c-.85 0-1.4-.55-1.4-1.4v-2c0-.85.55-1.4 1.4-1.4Z"/>
      <path d="m16.4 4.6 3.35 3.35-3.35 3.35-3.35-3.35Z"/>
      <path d="M7.35 14.3h8.95c.9 0 1.45.55 1.45 1.45v2.05c0 .9-.55 1.45-1.45 1.45H7.35c-.9 0-1.45-.55-1.45-1.45v-2.05c0-.9.55-1.45 1.45-1.45Z"/>
      <path class="fine" d="M6.4 7.3h2.9"/>
      <path class="fine" d="M8.25 16.8h6.9"/>
      <circle class="dot" cx="5.2" cy="7.3" r=".55"/>
      <path class="fine" d="m15.45 7.95.65.65 1.25-1.5"/>
      <path d="M11.7 7.3h1.35"/>
      <path d="M16.4 11.3v.95c0 1.25-.72 1.9-2.05 2.05"/>
      <path d="M5.9 16.75H4.5c-1.2 0-2.05-.85-2.05-2.05V9.65"/>
      <path d="m1.35 10.9 1.1-1.25 1.25 1.1"/>
      <path d="M17.75 16.75h1.75c1.2 0 2.05-.85 2.05-2.05V9.45"/>
      <path d="m20.45 10.65 1.1-1.2 1.1 1.2"/>
    </g>
  </defs>

  <style>
    .panel {
      fill: #111317;
      stroke: rgb(255 255 255 / 0.12);
      stroke-width: 0.5;
    }

    .panel.light {
      fill: #f6f7fb;
      stroke: rgb(18 24 38 / 0.13);
    }

    .glyph {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .glyph .fine {
      stroke-width: 1.25;
      opacity: 0.76;
    }

    .glyph .dot {
      fill: currentColor;
      stroke: none;
    }

    .label {
      fill: currentColor;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 4.2px;
      font-weight: 650;
      letter-spacing: 0;
      text-anchor: middle;
    }
  </style>

  <g color="#f4f6ff">
    <rect class="panel" x="12" y="12" width="96" height="96" rx="12"/>
    <g class="glyph" transform="translate(42 30) scale(2.35)">
      <use href="#workflow-monoline-glyph"/>
    </g>
    <text class="label" x="60" y="92">workflow · dark</text>
  </g>

  <g color="#171b24">
    <rect class="panel light" x="132" y="12" width="96" height="96" rx="12"/>
    <g class="glyph" transform="translate(162 30) scale(2.35)">
      <use href="#workflow-monoline-glyph"/>
    </g>
    <text class="label" x="180" y="92">workflow · light</text>
  </g>
</svg>
