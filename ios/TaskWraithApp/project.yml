# XcodeGen spec for the TaskWraith iOS companion app.
#   brew install xcodegen
#   cd ios/TaskWraithApp && xcodegen generate && open TaskWraith.xcodeproj
# Then pick your iPhone/iPad (or a simulator) and Run. See README.md for
# device-testing prerequisites (Apple ID in Xcode, Developer Mode on device).
name: TaskWraith
options:
  bundleIdPrefix: com.taskwraith
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TaskWraithKit:
    path: ../TaskWraithKit
targets:
  TaskWraith:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Required-reason API declaration (UserDefaults / CA92.1) — App Store
      # submission requirement.
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - package: TaskWraithKit
        product: TaskWraithUI
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: TaskWraith
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance: the companion implements app-level E2EE with
        # standard CryptoKit algorithms (AES-256-GCM, Curve25519, HKDF-SHA-256)
        # and no proprietary crypto. App Store Connect's encryption questionnaire
        # (standard algorithms, not distributed in France) returned "no
        # documentation required", so this is NO — which skips the per-build
        # encryption questions. France is excluded in App Store Connect →
        # Availability; the US BIS 5D992.c mass-market self-classification report
        # is tracked separately as a release checklist item (not an Apple gate).
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        # The Mac sends content-available:1 background pushes (wake →
        # resolve → reconnect, see Http2ApnsPusher). iOS silently DROPS
        # silent pushes unless the app declares this mode — without it only
        # visible alert pushes arrive (TestFlight blocker).
        UIBackgroundModes:
          - remote-notification
        # iPhone stays portrait-first; iPad rotates freely (split-view shell).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "TaskWraith uses the camera to scan the pairing QR code shown on your Mac."
        NSLocalNetworkUsageDescription: "TaskWraith connects to the pairing relay on your local network to reach your Mac."
        # ATS: NO global bypass (TestFlight blocker — removed). The scoped
        # local-networking exception covers LAN-relay dev workflows; remote
        # use must be wss:// (e.g. `tailscale cert` for a Tailnet relay).
        # The E2EE layer protects payloads regardless — this is about not
        # exposing handshake metadata + the confirm code to on-path
        # observers, and about App Store policy.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: TaskWraith.entitlements
      properties:
        # Debug/device builds use sandbox APNs. Release archives embed
        # production so TestFlight/App Store builds can receive pushes.
        aps-environment: "$(APS_ENVIRONMENT)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taskwraith.companion
        # Select your Apple Developer team locally in Signing & Capabilities
        # before running on a physical device.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8CZML8FK2D
        CURRENT_PROJECT_VERSION: "12"
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  TaskWraithUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TaskWraith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taskwraith.companion.uitests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
  TaskWraithUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
    dependencies:
      - target: TaskWraith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taskwraith.companion.tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
schemes:
  TaskWraith:
    build:
      targets:
        TaskWraith: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - TaskWraithUnitTests
        - TaskWraithUITests
    profile:
      config: Release
    analyze:
      config: Debug
