# XcodeGen spec for the TaskWraith iOS companion app.
#   brew install xcodegen
#   cd ios/TaskWraithApp && xcodegen generate && open TaskWraith.xcodeproj
# Then pick your iPhone/iPad (or a simulator) and Run. See README.md for
# device-testing prerequisites (Apple ID in Xcode, Developer Mode on device).
name: TaskWraith
options:
  bundleIdPrefix: com.taskwraith
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TaskWraithKit:
    path: ../TaskWraithKit
targets:
  TaskWraith:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Required-reason API declaration (UserDefaults / CA92.1) — App Store
      # submission requirement.
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - package: TaskWraithKit
        product: TaskWraithUI
      # The app DEPENDS on the NSE so XcodeGen embeds it into the app's PlugIns/.
      - target: TaskWraithNotificationService
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: TaskWraith
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance: the companion implements app-level E2EE with
        # standard CryptoKit algorithms (AES-256-GCM, Curve25519, HKDF-SHA-256)
        # and no proprietary crypto. App Store Connect's encryption questionnaire
        # (standard algorithms, not distributed in France) returned "no
        # documentation required", so this is NO — which skips the per-build
        # encryption questions. France is excluded in App Store Connect →
        # Availability; the US BIS 5D992.c mass-market self-classification report
        # is tracked separately as a release checklist item (not an Apple gate).
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        # The Mac sends content-available:1 background pushes (wake →
        # resolve → reconnect, see Http2ApnsPusher). iOS silently DROPS
        # silent pushes unless the app declares this mode — without it only
        # visible alert pushes arrive (TestFlight blocker).
        UIBackgroundModes:
          - remote-notification
        # iPhone leads portrait but rotates (ba93d11ec adapts the composer to
        # short viewports); iPad rotates freely (split-view shell). Portrait is
        # FIRST on purpose — iOS treats the first entry as preferred.
        #
        # ba93d11ec set this in Generated/Info.plist only. That file is XcodeGen
        # OUTPUT, so the feature was one `xcodegen generate` away from silently
        # reverting; the spec is the source of truth and has to carry it.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "TaskWraith uses the camera to scan the pairing QR code shown on your Mac."
        NSLocalNetworkUsageDescription: "TaskWraith connects to the pairing relay on your local network to reach your Mac."
        # ATS: NO global bypass. Apple's scoped local-networking exception
        # covers LAN, unqualified/.local names, and IPv4/IPv6 literals. The
        # client further restricts ws:// to LAN + Tailscale's 100.64/10 range;
        # other remote relays must use wss://. Tailscale supplies WireGuard and
        # TaskWraith independently authenticates/encrypts the session.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: TaskWraith.entitlements
      properties:
        # Debug/device builds use sandbox APNs. Release archives embed
        # production so TestFlight/App Store builds can receive pushes.
        aps-environment: "$(APS_ENVIRONMENT)"
        # Shared with the Notification Service Extension so it can read the
        # paired-host store (each host's push-agreement key) + the identity seed
        # to decrypt rich pushes. MUST match TWPushKeyAccess in TaskWraithKit.
        com.apple.security.application-groups:
          - group.com.TaskWraith.companion
        # List the app's own group too: once keychain-access-groups is set iOS
        # stops auto-including it, and the existing identity-seed reads use it
        # until the seed is migrated into the shared group.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.taskwraith.companion
          - $(AppIdentifierPrefix)com.taskwraith.companion.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taskwraith.companion
        # Select your Apple Developer team locally in Signing & Capabilities
        # before running on a physical device.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8CZML8FK2D
        CURRENT_PROJECT_VERSION: "84"
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternate app icons (theme-aware: each appiconset carries its own
        # Default/Dark/Tinted appearances, auto-rendered by iOS). INCLUDE_ALL
        # stops the optimizer stripping alternates (which makes
        # supportsAlternateIcons false). Mirror: src/shared/iconVariants.ts.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-WWDC26 AppIcon-Monoline AppIcon-Glass"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
  TaskWraithNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    dependencies:
      # The lean crypto target (NOT TaskWraithUI — no UIKit/Runestone weight in
      # the extension). TWPushSeal / CompletionBannerRenderer / CompletionPushContent
      # / TWPushKeyAccess all live in TaskWraithKit.
      - package: TaskWraithKit
        product: TaskWraithKit
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: TaskWraith Notifications
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.TaskWraith.companion
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.taskwraith.companion.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taskwraith.companion.nse
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8CZML8FK2D
        # MUST track the app's version/build — App Store rejects a mismatch.
        CURRENT_PROJECT_VERSION: "84"
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  TaskWraithUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TaskWraith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taskwraith.companion.uitests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        # Test bundles have no committed Info.plist; simulator ad-hoc signing
        # requires one, so let Xcode synthesize it.
        GENERATE_INFOPLIST_FILE: YES
  TaskWraithUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
    dependencies:
      - target: TaskWraith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taskwraith.companion.tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TaskWraith:
    build:
      targets:
        TaskWraith: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - TaskWraithUnitTests
        - TaskWraithUITests
    profile:
      config: Release
    analyze:
      config: Debug
