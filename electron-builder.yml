appId: com.chrisizatt.taskwraith
productName: TaskWraith
extraMetadata:
  taskwraithDistributionIdentity: beta
  taskwraithAppId: com.chrisizatt.taskwraith
  taskwraithUpdateFeedChannel: latest
directories:
  buildResources: build
# TaskWraith's UI strings are app-authored; keep Electron's own Chromium
# locale payload small and avoid Electron 39 gendered .lproj resources that
# current mac signing tooling can reference after packaging prunes them.
electronLanguages:
  - en
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!dist/**'
  - '!dist-debug/**'
  # Misc top-level artefacts that have shown up in earlier ships.
  - '!*.zip'
  - '!*.dmg'
  # Local agent/session state from the development loop.
  - '!.claude/**'
  - '!.cursor/**'
  - '!.fixpass*'
  - '!.wsa-*'
  # Shared-checkout coordination markers (AGENTS.md / CLAUDE.md). These are
  # untracked and gitignored, but this list is a denylist, so without these
  # entries a marker held during a build is bundled into app.asar carrying
  # session id, agent, host pid and claimed paths. Worse, its lease is
  # re-stamped by hand every 15 minutes, so if the content changes between
  # the arm64 and x64 passes of a universal build, @electron/universal dies
  # with "Can't reconcile two non-macho files <marker>" and the release
  # build fails. Both observed 2026-08-16 during the 1.9.6 gate run.
  - '!.WORK-IN-PROGRESS-*.md'
  - '!SESSION-IN-PROGRESS*'
  - '!SHIP-HOLD*'
  # Build-time scratch that is WRITTEN WHILE THE BUILD RUNS. This is not just
  # bloat — it corrupts the archive. electron-builder records each file's size
  # in the asar header and then streams the bytes; every later file's offset is
  # the running sum of those sizes. `.work-guard/heartbeat.json` is the
  # concurrency clock, is megabytes large, and is rewritten every few seconds
  # by any peer session, so it shrank 121 bytes between its stat and its read
  # during the 1.9.6 universal build. Every entry after it was then 121 bytes
  # off, and the FIRST thing afterPack reads is the root package.json:
  #   "packaged package.json is invalid JSON: Unexpected token 'd', "dex.js","
  # — the parse starting mid-way through `"./out/main/index.js"`. The error
  # names package.json, which is intact; nothing is wrong with it.
  # `.tmp_vitest` is the same hazard (a peer running the suite mid-build) plus
  # 558 entries of test droppings. Both are untracked and gitignored, which is
  # exactly why this denylist has to name them.
  - '!.work-guard/**'
  - '!.tmp_vitest/**'
  - '!test_output.log'
  # Dev/CI artefact trees. No runtime code resolves any of these; `resources/`
  # (app icons, Tools.md) is the one sibling that IS load-bearing — do not add
  # it here.
  - '!artifacts/**'
  - '!perf-artifacts/**'
  - '!prototypes/**'
  - '!papercuts/**'
  - '!.githooks/**'
  # Native/mobile source trees are development inputs only. The mac app
  # receives the release TaskWraithBridgeDaemon via `mac.extraResources`
  # below; packaging the full Swift/iOS `.build` trees into app.asar
  # bloated debug builds by hundreds of megabytes.
  - '!swift/**'
  - '!ios/**'
  - '!design-assets/**'
  # Dev/release-only material that has no business in a distributed app.asar
  # (a security reviewer found .local-only + docs + AGENTS.md shipping in
  # 1.4.9). This `files` list is a denylist, so anything not excluded here
  # gets bundled — keep it exhaustive for non-runtime trees.
  - '!.local-only/**'
  - '!docs/**'
  - '!tests/**'
  - '!scripts/**'
  # The 1.9.9-only, hash-pinned identity payload is installed by afterPack.
  # Excluding it from app.asar avoids a self-referential 0.1.0 artifact hash.
  - '!resources/identity-handoff.json'
  # relay/src is statically imported into out/main at build time (bundled),
  # so the source tree itself is dead weight in the package.
  - '!relay/**'
  - '!{AGENTS.md,CLAUDE.md,ARCHITECTURE.md,WINDOWS_PARITY_QA.md,TERMS_NOTES.md}'
  - '!{electron-builder.yml,electron-builder.debug.yml,vitest.config.ts}'
  - '!**/*.tsbuildinfo'
  # TUI payload + official Node runtime ship outside app.asar via top-level
  # extraResources (Developer Preview sidecar). RunAsNode is fused off on the
  # App binary; launchers exec tui-runtime/<platform>-<arch>/node instead.
  - '!out/tui/**'
  - '!build/tui-launcher/**'
  - '!build/tui-runtime/**'
  # pdfjs-dist ships ~36MB, most of it dev artefacts and a browser viewer we
  # never load. Pruning the unused trees takes it to roughly 9MB.
  #
  # LANDMINE: `legacy/` is the build we actually run and MUST stay. The default
  # `build/` tree assumes browser globals and throws
  # "ReferenceError: DOMMatrix is not defined" at import time in the Electron
  # main process — pdfjs itself warns to use the legacy build under Node. Do not
  # "tidy up" by swapping which of the two is excluded here.
  # `cmaps/` (CJK encodings) and `standard_fonts/` are load-bearing for text
  # extraction from documents that don't embed their fonts — leave them in.
  - '!node_modules/pdfjs-dist/**/*.map'
  - '!node_modules/pdfjs-dist/build/**'
  - '!node_modules/pdfjs-dist/web/**'
  - '!node_modules/pdfjs-dist/types/**'
  - '!node_modules/pdfjs-dist/image_decoders/**'
  # LANDMINE: do NOT exclude @napi-rs/canvas to dodge the universal-merge
  # error. pdfjs's legacy build runs `new DOMMatrix()` at MODULE TOP LEVEL
  # (pdf.mjs ~16605) and @napi-rs/canvas is the only thing that polyfills
  # DOMMatrix under Node. Dropping it still builds, then throws
  # "ReferenceError: DOMMatrix is not defined" on the first PDF extraction.
  # (The package's own "Cannot polyfill DOMMatrix … rendering may be broken"
  # warning is misleading — text extraction dies too.) Verified empirically.
  # The universal build instead needs BOTH arch slices present + an
  # x64ArchFiles entry, the same treatment claude-agent-sdk/node-pty get.
# All platforms: packaged TUI + launchers + Node runtime live under
# process.resourcesPath (macOS: TaskWraith.app/Contents/Resources/; win/linux:
# <install>/resources/). Requires `npm run tui:build` and
# `npm run prepare:tui-runtime` (or prepare:tui-runtime:mac for universal)
# before electron-builder. Do NOT re-enable FuseV1 RunAsNode for the App binary.
extraResources:
  - from: out/tui
    to: tui
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/.DS_Store'
  - from: build/tui-launcher
    to: bin
    filter:
      - '**/*'
      - '!**/.DS_Store'
  - from: build/tui-runtime
    to: tui-runtime
    filter:
      - '**/*'
      - '!**/.DS_Store'
      - '!**/.cache/**'
      - '!**/README.md'
      - '!**/*.partial'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
  # Keep @napi-rs/canvas native bindings loadable outside asar. Both Darwin
  # platform packages must be present (see prepare:mac-universal-deps) so the
  # universal merge can keep single-arch skia.*.node files as resources.
  - node_modules/@napi-rs/canvas/**
  - node_modules/@napi-rs/canvas-darwin-*/**
afterPack: build/validate-native-modules.cjs
win:
  executableName: TaskWraith
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  artifactName: TaskWraith-${version}-win-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  createDesktopShortcut: always
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  artifactName: TaskWraith-${version}-universal-mac.${ext}
  # These packages ship separate darwin-arm64 and darwin-x64 helper
  # resources. Each helper binary is intentionally single-arch and
  # identical in the x64/arm64 temp apps, so @electron/universal must
  # keep them as resources rather than trying to lipo them.
  x64ArchFiles: '{**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/claude,**/node_modules/node-pty/prebuilds/darwin-*/*,**/node_modules/@napi-rs/canvas-darwin-*/*,**/tui-runtime/darwin-*/node}'
  entitlementsInherit: build/entitlements.mac.plist
  sign: build/sign-with-identity-hash.cjs
  # extendInfo MUST be a flat dict, not a list-of-dicts. The list form
  # gets serialized into the Info.plist as numbered wrapper keys
  # ("0" => { NSCameraUsageDescription: ... }, "1" => { ... }, …),
  # which means macOS never sees any of the usage-description keys at
  # the root path where it actually checks them. That's why prior
  # builds quietly failed to prompt for permissions and why the
  # _taskwraith-quic._udp carrier was being dropped before reaching
  # the daemon: NSBonjourServices was sitting under "5", not at root.
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSSpeechRecognitionUsageDescription: TaskWraith transcribes audio files you point it at entirely on-device (no audio leaves your Mac) so agents can read back what was said.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    NSLocalNetworkUsageDescription: TaskWraith discovers and connects to your paired iPhone or iPad on your local network to stream live run events, approval requests, and tool outputs.
    NSScreenCaptureUsageDescription: TaskWraith captures the window you explicitly pick with the macOS screen-sharing picker for one-off screenshots or a live low-frame-rate Screen Watch stream. While Screen Watch is active, captured frames may leave your Mac for the hosted AI provider attached to your chat so it can interpret the app; stop Screen Watch or detach the window to end capture.
    # Phase K4 — AppleScript dispatch into creative apps (Final Cut Pro,
    # Logic Pro) sends AppleEvents from the TaskWraith process. Hardened-
    # runtime apps need this Info.plist string before the OS will route
    # cross-app automation; missing it means the OS silently rejects
    # every AppleScript call with errAEEventNotPermitted (-1743).
    NSAppleEventsUsageDescription: TaskWraith sends AppleScript automation commands to Final Cut Pro and Logic Pro on your behalf — only after you approve each action in the in-app modal. Every dispatch is auditable in the approval log.
    NSBonjourServices:
      - _taskwraith._tcp
      - _taskwraith-quic._udp
  notarize: false
  # Bundle the Swift TaskWraithBridgeDaemon as an extraResource so the
  # main process can spawn it from the packaged .app. The binary is
  # compiled by `scripts/build-bridge-daemon.cjs` (run via the
  # `prebuild:bridge-daemon` npm script in all mac build targets).
  # macOS-only: the daemon uses Apple Network framework + Bonjour +
  # CryptoKit and is not built on other platforms. The separate Studio app is
  # pre-lipo'd by scripts/build-studio-companion.cjs so both temporary apps in
  # the universal merge contain the same nested bundle. It stays unsigned here;
  # the parent macOS signing pass seals nested code in final-inside-out order.
  extraResources:
    - from: swift/TaskWraithBridge/.build/release/TaskWraithBridgeDaemon
      to: bridge/TaskWraithBridgeDaemon
    - from: swift/TaskWraithBridge/.build/studio/TaskWraith Studio.app
      to: studio/TaskWraith Studio.app
dmg:
  artifactName: TaskWraith-${version}-universal-mac.${ext}
  # Branded installer window. The visible composition is 660x420 inside a
  # 960x720 dark bleed bitmap generated by `scripts/export-dmg-background.cjs`.
  # Current Finder versions may show roughly 124px of toolbar/status chrome
  # despite the DMG asking to hide it, so the opening frame is 660x544. The
  # runner preload keeps these bounds independent from the larger bitmap.
  background: background.png
  title: ${productName} ${version}
  window:
    width: 660
    height: 544
  iconSize: 100
  iconTextSize: 13
  # These are the intended default centres. The artwork avoids icon-sized
  # pedestals because Finder's zoom control can independently reflow items.
  contents:
    - x: 172
      y: 250
      type: file
    - x: 488
      y: 250
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: TaskWraith-${version}.${ext}
npmRebuild: true
detectUpdateChannel: true
generateUpdatesFilesForAllChannels: true
publish:
  provider: github
  owner: boggspa
  repo: TaskWraith
  releaseType: release
