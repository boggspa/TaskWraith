name: Provider permission conformance
run-name: ${{ github.event.action }} @ ${{ github.sha }}

# Credentialed provider canaries are deliberately dispatch-only. They run real
# model/network turns. A protected Environment supplies a non-rotating Kimi
# provider API key to a fresh hosted macOS VM; OAuth credentials are forbidden
# because their single-use refresh token cannot survive an ephemeral source home.
#
# repository_dispatch always runs workflow code from the default branch; unlike
# workflow_dispatch it cannot select an arbitrary ref. The named Environment
# MUST additionally restrict deployments to the protected default branch and
# require the repository's release reviewers.
on:
  repository_dispatch:
    types:
      - provider-permission-qualification
      - provider-permission-release

permissions:
  contents: read

concurrency:
  group: provider-containment-canaries
  cancel-in-progress: false

jobs:
  environment-configuration-gate:
    name: Require commissioned protected canary environment
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail closed until external environment protections are configured
        env:
          PROVIDER_CANARY_ENVIRONMENT_CONFIGURED: ${{ vars.PROVIDER_CANARY_ENVIRONMENT_CONFIGURED }}
        run: test "$PROVIDER_CANARY_ENVIRONMENT_CONFIGURED" = "true"

  live-containment:
    name: Live provider permission conformance
    needs: environment-configuration-gate
    if: vars.PROVIDER_CANARY_ENVIRONMENT_CONFIGURED == 'true'
    runs-on: macos-15
    environment: provider-containment-canaries
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Require the exact protected default-branch tip
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/master)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      # All dependency acquisition completes before the protected API key is
      # materialized. Project and provider lifecycle scripts stay disabled.
      - run: npm ci --ignore-scripts
      - name: Verify runtime qualification projection parity
        run: npm run verify:kimi-runtime-qualifications
      - name: Prepare private canary root and install the exact native Kimi build
        shell: bash
        run: |
          set -euo pipefail
          canary_root="$RUNNER_TEMP/taskwraith-provider-canary"
          case "$canary_root" in
            "$RUNNER_TEMP"/taskwraith-provider-canary) ;;
            *) echo "Unsafe canary root: $canary_root"; exit 1 ;;
          esac
          if [ -L "$canary_root" ]; then
            echo "Canary root must not be a symlink."
            exit 1
          fi
          if [ -e "$canary_root" ]; then
            test -O "$canary_root"
            chmod -R u+rwX "$canary_root"
            rm -rf -- "$canary_root"
            test ! -e "$canary_root"
          fi
          install -d -m 700 "$canary_root" "$canary_root/install" "$canary_root/runtime-tmp"
          (set -o noclobber; : > "$canary_root/.lease")
          chmod 600 "$canary_root/.lease"

          binary="$canary_root/install/kimi"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --output "$binary" \
            'https://code.kimi.com/kimi-code/binaries/0.27.0/kimi-code-darwin-arm64'
          echo '550bca0ba6e474f4e0faeadfae03a9294c7c25688670f38ff488ab8cf176d817  '"$binary" | shasum -a 256 -c -
          chmod 755 "$binary"
          test -x "$binary"

          {
            echo "TASKWRAITH_PROVIDER_CANARY_JOB_ROOT=$canary_root"
            echo "TASKWRAITH_KIMI_CANARY_BIN=$binary"
            echo "TASKWRAITH_KIMI_CANARY_HOME=$canary_root/source-home"
            echo "TASKWRAITH_KIMI_CANARY_DISTRIBUTION=official-native-single-binary"
            echo "TMPDIR=$canary_root/runtime-tmp"
          } >> "$GITHUB_ENV"
      - name: Materialize protected non-rotating Kimi API-key profile
        shell: bash
        env:
          KIMI_CODE_CANARY_API_KEY: ${{ secrets.KIMI_CODE_CANARY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$KIMI_CODE_CANARY_API_KEY"
          source_home="$TASKWRAITH_KIMI_CANARY_HOME"
          install -d -m 700 "$source_home"
          CANARY_CONFIG_PATH="$source_home/config.toml" node <<'NODE'
          const fs = require('node:fs')
          const apiKey = process.env.KIMI_CODE_CANARY_API_KEY
          const configPath = process.env.CANARY_CONFIG_PATH
          if (!apiKey || !configPath) process.exit(1)
          const body = [
            'default_model = "kimi-code/kimi-for-coding"',
            'telemetry = false',
            '',
            '[providers.kimi]',
            'type = "kimi"',
            'base_url = "https://api.kimi.com/coding/v1"',
            `api_key = ${JSON.stringify(apiKey)}`,
            '',
            '[models."kimi-code/kimi-for-coding"]',
            'provider = "kimi"',
            'model = "kimi-for-coding"',
            'max_context_size = 262144',
            'capabilities = ["thinking", "tool_use"]',
            ''
          ].join('\n')
          fs.writeFileSync(configPath, body, { encoding: 'utf8', mode: 0o600 })
          NODE
          chmod 600 "$source_home/config.toml"
          test -s "$source_home/config.toml"
          test ! -e "$source_home/credentials/kimi-code.json"
      - name: Produce qualification-candidate evidence
        if: github.event.action == 'provider-permission-qualification'
        run: npm run verify:provider-permissions:live
      - name: Enforce reviewed provider fingerprints
        if: github.event.action == 'provider-permission-release'
        run: npm run verify:provider-permissions:release
      - name: Validate strict release evidence semantics
        if: github.event.action == 'provider-permission-release'
        run: >-
          node scripts/verify-provider-canary-aggregate.cjs
          --input=artifacts/provider-permission-conformance.json
          --sha="$GITHUB_SHA"
      - name: Remove provider credentials and private canary roots
        id: scrub
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          canary_root="${TASKWRAITH_PROVIDER_CANARY_JOB_ROOT:-$RUNNER_TEMP/taskwraith-provider-canary}"
          case "$canary_root" in
            "$RUNNER_TEMP"/taskwraith-provider-canary) ;;
            *) echo "Refusing unsafe canary cleanup target: $canary_root"; exit 1 ;;
          esac
          if [ -e "$canary_root" ]; then
            test ! -L "$canary_root"
            test -O "$canary_root"
            chmod -R u+rwX "$canary_root"
            rm -rf -- "$canary_root"
          fi
          test ! -e "$canary_root"
      - name: Upload sanitized canary evidence after credential scrub
        if: always() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-permission-conformance-${{ github.run_id }}
          path: |
            artifacts/provider-permission-conformance.json
            artifacts/provider-permission-conformance.xml
          if-no-files-found: error
          retention-days: 30

  attestation-completion-gate:
    name: Require successful credentialed canary completion
    runs-on: ubuntu-latest
    needs: [environment-configuration-gate, live-containment]
    if: always()
    permissions: {}
    steps:
      - name: Reject failed or skipped canary execution
        env:
          CONFIGURATION_RESULT: ${{ needs.environment-configuration-gate.result }}
          LIVE_CONTAINMENT_RESULT: ${{ needs.live-containment.result }}
        run: |
          test "$CONFIGURATION_RESULT" = "success"
          test "$LIVE_CONTAINMENT_RESULT" = "success"
