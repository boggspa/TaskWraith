name: Cancel superseded queued-start CI

on:
  push:
    branches:
      - codex/cancel-superseded-queued-start-ci-666bdf7

permissions: {}

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Cancel only the four verified superseded CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const repo = 'boggspa/TaskWraith'
          const current16 = '666bdf72ec989968cd8a58fd355c699edfbd225b'
          const current17 = '5df86faaed363e789487cc3bbc7af15e25f9c42f'
          const branch16 = 'codex/argon-quota-effort-followup'
          const branch17 = 'codex/gemini-tool-loop-billing'
          const maintenanceBranch = 'codex/cancel-superseded-queued-start-ci-666bdf7'
          const allowed = [
            { id: 39375008998, sha: 'feb14a51cf082db65c578c1edb0792d997690ef9', branch: branch16, event: 'push' },
            { id: 39375015364, sha: 'feb14a51cf082db65c578c1edb0792d997690ef9', branch: branch16, event: 'pull_request' },
            { id: 39375276126, sha: '9206d9e2bde14ca62d26dc75b834c0329e19fc42', branch: branch17, event: 'push' },
            { id: 39375281797, sha: '9206d9e2bde14ca62d26dc75b834c0329e19fc42', branch: branch17, event: 'pull_request' }
          ]
          if (process.env.GITHUB_REPOSITORY !== repo ||
              process.env.GITHUB_EVENT_NAME !== 'push' ||
              process.env.GITHUB_REF !== 'refs/heads/' + maintenanceBranch ||
              !process.env.GH_TOKEN) throw new Error('Unexpected maintenance context')
          async function request(path, method = 'GET') {
            const response = await fetch('https://api.github.com/repos/' + repo + '/' + path, {
              method,
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: 'Bearer ' + process.env.GH_TOKEN,
                'X-GitHub-Api-Version': '2026-03-10',
                'User-Agent': 'TaskWraith-superseded-CI-maintenance'
              }
            })
            const expected = method === 'POST' ? 202 : 200
            if (response.status !== expected) throw new Error(method + ' ' + path + ' returned ' + response.status)
            return method === 'POST' ? response.status : response.json()
          }
          async function protectedHeads() {
            const branches = ['master', 'codex/add-gemini-4-argon', branch16, branch17]
            const refs = await Promise.all(branches.map((branch) => request('git/ref/heads/' + branch)))
            if (refs.some((ref, index) => ref.ref !== 'refs/heads/' + branches[index] ||
                ref.object?.type !== 'commit' || !/^[a-f0-9]{40}$/.test(ref.object.sha))) {
              throw new Error('Invalid protected branch response')
            }
            if (refs[2].object.sha !== current16) throw new Error('Current PR16 branch changed')
            if (refs[3].object.sha !== current17) throw new Error('Current PR17 branch changed')
            const heads = new Set(refs.map((ref) => ref.object.sha))
            heads.add(process.env.GITHUB_SHA)
            let foundCurrent16 = false
            let foundCurrent17 = false
            let complete = false
            for (let page = 1; page <= 100; page += 1) {
              const pulls = await request('pulls?state=open&per_page=100&page=' + page)
              if (!Array.isArray(pulls)) throw new Error('Invalid open PR response')
              for (const pr of pulls) {
                if (!/^[a-f0-9]{40}$/.test(pr.head?.sha)) throw new Error('Invalid open PR head')
                heads.add(pr.head.sha)
                if (pr.number === 16) {
                  if (pr.head.sha !== current16 || pr.head.ref !== branch16 ||
                      pr.head.repo?.full_name !== repo) throw new Error('Open PR16 head changed')
                  foundCurrent16 = true
                }
                if (pr.number === 17) {
                  if (pr.head.sha !== current17 || pr.head.ref !== branch17 ||
                      pr.head.repo?.full_name !== repo) throw new Error('Open PR17 head changed')
                  foundCurrent17 = true
                }
              }
              if (pulls.length < 100) { complete = true; break }
            }
            if (!complete || !foundCurrent16 || !foundCurrent17) throw new Error('Could not establish every open PR head')
            return heads
          }
          function validate(run, target) {
            if (run.id !== target.id || run.head_sha !== target.sha ||
                run.head_branch !== target.branch || run.event !== target.event ||
                run.name !== 'CI' || run.path !== '.github/workflows/ci.yml' ||
                run.workflow_id !== 287125620 || run.run_attempt !== 1 ||
                run.repository?.full_name !== repo || run.head_repository?.full_name !== repo ||
                String(run.id) === process.env.GITHUB_RUN_ID) {
              throw new Error('Allowlisted run identity mismatch: ' + target.id)
            }
            if (!['queued', 'in_progress', 'completed'].includes(run.status)) {
              throw new Error('Unexpected run state: ' + target.id + ' ' + run.status)
            }
          }
          ;(async () => {
            const initialHeads = await protectedHeads()
            for (const target of allowed) {
              const run = await request('actions/runs/' + target.id)
              validate(run, target)
              if (initialHeads.has(run.head_sha)) throw new Error('Run is current: ' + target.id)
              console.log('PREFLIGHT ' + JSON.stringify({ id: run.id, head: run.head_sha, event: run.event, status: run.status }))
            }
            for (const target of allowed) {
              const run = await request('actions/runs/' + target.id)
              validate(run, target)
              if (run.status === 'completed') {
                console.log('SKIP_COMPLETED ' + JSON.stringify({ id: run.id, conclusion: run.conclusion }))
                continue
              }
              const liveHeads = await protectedHeads()
              if (liveHeads.has(run.head_sha)) throw new Error('Run became current: ' + target.id)
              const status = await request('actions/runs/' + target.id + '/cancel', 'POST')
              console.log('CANCEL_ACCEPTED ' + JSON.stringify({ id: target.id, head: target.sha, status }))
            }
          })().catch((error) => { console.error(String(error)); process.exitCode = 1 })
          
          NODE
