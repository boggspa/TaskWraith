name: Queued-start barrier diagnostic

on:
  push:
    branches:
      - codex/queued-start-barrier-diagnostic-9206d9e

permissions:
  contents: read

jobs:
  regression:
    name: Queued-start regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Format and verify the two candidate files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const { execFileSync } = require('node:child_process')
          const prettier = require('prettier')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).packages['node_modules/prettier']
          if (lock.version !== '3.8.3' || prettier.version !== lock.version) throw new Error('Unexpected formatter version')
          const files = ['src/host-node/ThreadCatalogueHostRunWindow.ts', 'src/host-node/ThreadCatalogueHostRunWindow.test.ts']
          const blobSha = (content) => crypto.createHash('sha1').update('blob ' + Buffer.byteLength(content) + '\0' + content).digest('hex')
          ;(async () => {
            for (const file of files) {
              const candidate = execFileSync('git', ['show', 'HEAD:' + file], { encoding: 'utf8' })
              const options = { ...(await prettier.resolveConfig(file)), filepath: file }
              const formatted = await prettier.format(candidate, options)
              const equivalent = candidate.replace(/\s/g, '') === formatted.replace(/\s/g, '')
              const clean = await prettier.check(formatted, options)
              const idempotent = formatted === await prettier.format(formatted, options)
              console.log('QUEUE_FORMAT_RESULT ' + JSON.stringify({ file, version: prettier.version, candidateBlob: blobSha(candidate), formattedBlob: blobSha(formatted), changed: candidate !== formatted, equivalent, clean, idempotent, formatted: process.platform === 'linux' ? formatted : null }))
              if (!equivalent || !clean || !idempotent) throw new Error('Formatter verification failed')
              fs.writeFileSync(file, formatted)
            }
          })().catch((error) => { console.error(error); process.exitCode = 1 })
          NODE
      - name: Prove both regressions fail on the unchanged source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { execFileSync, spawnSync } = require('node:child_process')
          const source = 'src/host-node/ThreadCatalogueHostRunWindow.ts'
          const tests = 'src/host-node/ThreadCatalogueHostRunWindow.test.ts'
          const base = '9206d9e2bde14ca62d26dc75b834c0329e19fc42'
          if (execFileSync('git', ['rev-parse', 'HEAD^'], { encoding: 'utf8' }).trim() !== base) throw new Error('Unexpected diagnostic parent')
          const candidate = fs.readFileSync(source)
          const original = execFileSync('git', ['show', base + ':' + source])
          const reportPath = path.join(process.env.RUNNER_TEMP, 'taskwraith-queued-start-red.json')
          const titles = [
            're-reads after a display refresh begins during the metadata-open barrier',
            'retries a superseded metadata import before proving a run omitted by an earlier display read'
          ]
          try {
            fs.writeFileSync(source, original)
            const result = spawnSync(process.execPath, ['node_modules/vitest/vitest.mjs', 'run', tests, '-t', titles.join('|'), '--reporter=json', '--outputFile=' + reportPath], { encoding: 'utf8', timeout: 120000, maxBuffer: 5 * 1024 * 1024 })
            if (result.error || result.signal || result.status !== 1 || !fs.existsSync(reportPath)) {
              console.error(result.error || result.signal || result.stdout + result.stderr)
              throw new Error('Original source did not produce the expected assertion failures')
            }
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
            const failed = report.testResults.flatMap((file) => file.assertionResults).filter((test) => test.status === 'failed')
            if (report.numFailedTests !== 2 || report.numPassedTests !== 0 || failed.length !== 2 || failed.some((test) => !titles.includes(test.title) || !test.failureMessages.some((message) => message.includes('expected false to be true')))) {
              console.error(JSON.stringify(report))
              throw new Error('Red result was not the two expected current-state assertions')
            }
            console.log('QUEUE_REGRESSION_RED ' + JSON.stringify({ base, platform: process.platform, failedTests: failed.map((test) => ({ title: test.title, failureMessages: test.failureMessages })), failedCount: report.numFailedTests, passedCount: report.numPassedTests }))
          } finally {
            fs.writeFileSync(source, candidate)
          }
          NODE
      - name: Verify corrected run-window and queued-start behavior
        run: >-
          npx --no-install vitest run
          src/host-node/ThreadCatalogueHostRunWindow.test.ts
          src/host-node/ThreadCatalogueHostRunWindow.persist.test.ts
          src/host-runtime/HostQueuedStartPublication.test.ts
          src/host-node/HostQueuedStartInterference.subprocess.test.ts
      - run: npm run typecheck:node
      - run: npm run typecheck:host
      - name: Lint both changed files
        run: >-
          npx --no-install eslint --quiet
          src/host-node/ThreadCatalogueHostRunWindow.ts
          src/host-node/ThreadCatalogueHostRunWindow.test.ts
      - name: Verify projected production formatting ratchet
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const prettier = require('prettier')
          const base = '9206d9e2bde14ca62d26dc75b834c0329e19fc42'
          ;(async () => {
            let projectedCount = 0
            let considered = 0
            for (const file of execFileSync('git', ['ls-files'], { encoding: 'utf8' }).split('\n').filter(Boolean)) {
              let info
              try { info = await prettier.getFileInfo(file, { ignorePath: '.prettierignore' }) } catch { continue }
              if (info.ignored || !info.inferredParser) continue
              let content
              try {
                content = file === '.github/workflows/ci.yml'
                  ? execFileSync('git', ['show', base + ':' + file], { encoding: 'utf8' })
                  : fs.readFileSync(file, 'utf8')
              } catch { continue }
              considered += 1
              const options = { ...(await prettier.resolveConfig(file)), filepath: file }
              try { if (!(await prettier.check(content, options))) projectedCount += 1 } catch {}
            }
            const baseline = JSON.parse(fs.readFileSync('scripts/format-baseline.json', 'utf8')).unformattedFiles
            console.log('QUEUE_FORMAT_RATCHET ' + JSON.stringify({ projectedCount, considered, baseline, diagnosticWorkflowExcluded: true }))
            if (projectedCount > baseline) throw new Error('Projected production formatting ratchet exceeds baseline')
          })().catch((error) => { console.error(error); process.exitCode = 1 })
          NODE
