name: PR16 pinned formatter diagnostic

on:
  push:
    branches:
      - codex/pr16-format-diagnostic-63e164d

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 63e164d0e11a4f8e8a80a1cf4043ce02348ed50c
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Verify exact formatter output without modifying tracked files
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const crypto = require('node:crypto')
          const { execFileSync } = require('node:child_process')
          const install = path.join(process.env.RUNNER_TEMP, 'taskwraith-prettier-3.8.3')
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')).packages['node_modules/prettier']
          if (lock.version !== '3.8.3') throw new Error('Unexpected locked formatter version')
          const registryIntegrity = execFileSync('npm', ['view', 'prettier@3.8.3', 'dist.integrity', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' }).trim()
          if (registryIntegrity !== lock.integrity) throw new Error('Formatter integrity mismatch')
          execFileSync('npm', ['install', '--prefix', install, '--no-package-lock', '--ignore-scripts', '--no-audit', '--no-fund', '--registry=https://registry.npmjs.org', 'prettier@3.8.3'], { stdio: 'inherit' })
          const prettier = require(path.join(install, 'node_modules', 'prettier'))
          if (prettier.version !== lock.version) throw new Error('Installed formatter version mismatch')
          const files = ['src/host-runtime/cli.ts', 'src/host-client/HostShutdownClient.test.ts', 'src/host-runtime/HostProductionCli.test.ts', 'src/host-node/HostNodeProductionServe.subprocess.test.ts']
          const blobSha = (content) => crypto.createHash('sha1').update(`blob ${Buffer.byteLength(content)}\0${content}`).digest('hex')
          ;(async () => {
            const replacements = new Map()
            for (const file of files) {
              const original = fs.readFileSync(file, 'utf8')
              const options = { ...(await prettier.resolveConfig(file)), filepath: file }
              const formatted = await prettier.format(original, options)
              const changed = original !== formatted
              const equivalent = original.replace(/\s/g, '') === formatted.replace(/\s/g, '')
              const clean = await prettier.check(formatted, options)
              const idempotent = formatted === await prettier.format(formatted, options)
              console.log('FORMAT_RESULT ' + JSON.stringify({ file, version: prettier.version, originalBlob: blobSha(original), formattedBlob: blobSha(formatted), changed, equivalent, clean, idempotent, formatted: changed ? formatted : null }))
              if (!equivalent || !clean || !idempotent) throw new Error('Formatter verification failed for ' + file)
              if (changed) replacements.set(file, formatted)
            }
            let originalCount = 0
            let projectedCount = 0
            let considered = 0
            for (const file of execFileSync('git', ['ls-files'], { encoding: 'utf8' }).split('\n').filter(Boolean)) {
              let info
              try { info = await prettier.getFileInfo(file, { ignorePath: '.prettierignore' }) } catch { continue }
              if (info.ignored || !info.inferredParser) continue
              let original
              try { original = fs.readFileSync(file, 'utf8') } catch { continue }
              considered += 1
              const options = { ...(await prettier.resolveConfig(file)), filepath: file }
              try {
                const originalClean = await prettier.check(original, options)
                if (!originalClean) originalCount += 1
                const projectedClean = replacements.has(file) ? await prettier.check(replacements.get(file), options) : originalClean
                if (!projectedClean) projectedCount += 1
              } catch {}
            }
            const baseline = JSON.parse(fs.readFileSync('scripts/format-baseline.json', 'utf8')).unformattedFiles
            console.log('FORMAT_RATCHET ' + JSON.stringify({ originalCount, projectedCount, considered, baseline, replacements: [...replacements.keys()] }))
            if (projectedCount > baseline) throw new Error('Projected formatting ratchet exceeds baseline')
          })().catch((error) => { console.error(error); process.exitCode = 1 })
          NODE
