<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskWraith emulator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main aria-label="TaskWraith homebrew emulator">
      <canvas
        id="screen"
        width="160"
        height="144"
        tabindex="0"
        aria-label="Game Boy framebuffer"
        aria-describedby="controls-hint"
      ></canvas>
      <button id="play-pause" type="button" aria-pressed="false" disabled>Play</button>
      <p id="controls-hint">
        Arrow keys move; Z = B, X = A, Enter = Start, and Shift = Select. Pause before agent
        control.
      </p>
      <output id="status" aria-live="polite">Booting fixed fixture…</output>
    </main>
    <script type="module" src="./bootstrap.mjs"></script>
  </body>
</html>
